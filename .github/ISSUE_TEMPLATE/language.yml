name: Language inconsistency
description: Show a difference between a language rule and the result.
title: "[Language] "
body:
  - type: markdown
    attributes:
      value: "Use the smallest source and synthetic input that repeat the problem. Check and lint do not prove runtime success."
  - type: input
    id: version
    attributes:
      label: ZenSigil version and operating system
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source, including any imported module
      render: text
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: JSON input and optional contracts
      description: Use an empty object if no input is needed.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and language rule
      description: Link the rule if it is documented. Mark a proposed new rule as a design request.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and exact command or clicks
      render: text
    validations:
      required: true

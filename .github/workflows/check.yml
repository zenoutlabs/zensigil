name: Check ZenSigil
on: [push, pull_request]
permissions:
  contents: read
jobs:
  language:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: playground
      - run: node --test test/*.test.js
        working-directory: editors/vscode
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-deps --no-index --find-links dist zensigil
      - run: python -I tools/verify_install.py
      - run: python tools/package_release.py dist
      - run: python tools/verify_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: zensigil-release-candidate
          path: dist/
